# ============================================================
#  简历岗位雷达 · nginx 反向代理配置
#
#  放置位置（任选其一）：
#    /etc/nginx/conf.d/resume-radar.conf
#    /etc/nginx/sites-available/resume-radar  （再软链到 sites-enabled）
#
#  使用前把 jobs.example.com 换成你的域名，证书路径也要改。
#  申请免费证书：certbot --nginx -d jobs.example.com
# ============================================================

# ---------- 限流：在 nginx 层再挡一道 ----------
# 按 IP 限制请求速率，缓解暴力破解与爬取
limit_req_zone $binary_remote_addr zone=radar_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=radar_login:10m rate=10r/m;

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    # 证书续期校验放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobs.example.com;

    # ---- 证书 ----
    ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头（应用本身也会发，这里兜底）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # ---- 上传体积：简历文件 + base64 膨胀，留足余量 ----
    client_max_body_size 50m;
    client_body_timeout  60s;

    # ---- 访问日志 ----
    access_log /var/log/nginx/resume-radar.access.log;
    error_log  /var/log/nginx/resume-radar.error.log warn;

    # ---- 登录接口：更严格的限流 ----
    location = /api/login {
        limit_req zone=radar_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/radar-proxy.conf;
    }

    # ---- 检索接口：流式响应，必须关闭缓冲 ----
    # 一次检索要跑 40~90 秒，且进度是逐行推送的；
    # 若开启 proxy_buffering，前端会一直看不到进度直到结束。
    location = /api/analyze {
        limit_req zone=radar_api burst=3 nodelay;

        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/radar-proxy.conf;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location ~ ^/api/v2/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/radar-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---- 其余接口 ----
    location /api/ {
        limit_req zone=radar_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/radar-proxy.conf;
    }

    # ---- 静态资源 ----
    location / {
        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/radar-proxy.conf;
    }
}

# ============================================================
#  下面这段内容请另存为 /etc/nginx/snippets/radar-proxy.conf
#  （nginx 的 include 需要独立文件，这里一并给出便于复制）
