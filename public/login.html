<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 简历岗位雷达</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="logo">🎯</span>
        <h1>简历岗位雷达</h1>
        <p class="tagline">简历关键词 → 全网校招 / 实习岗位匹配</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <label class="field">
          <span class="field-label">访问密码</span>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="请输入站点访问密码"
            autocomplete="current-password"
            required
          />
          <small
            >填写本站访问密码，最多 1,024
            个字符；密码中的空格会原样保留。</small
          >
        </label>
        <button id="loginBtn" class="btn primary" type="submit">
          <span class="btn-label">进入</span>
        </button>
      </form>

      <p class="login-note" id="loginNote">
        本站为公开部署的求职检索工具。登录后可解析简历并检索岗位；若你担心额度，可在检索页填入自己的
        DeepSeek API Key。
      </p>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
